<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-shell">
        <section class="intro-panel" aria-labelledby="page-title">
            <p class="eyebrow">New account</p>
            <h1 id="page-title">Make a place for what comes next.</h1>
            <p class="intro-copy">
                Create your account with a few simple details. Your information
                stays private and secure.
            </p>
        </section>

        <section class="form-panel" aria-labelledby="form-title">
            <div class="form-heading">
                <p class="eyebrow">Get started</p>
                <h2 id="form-title">Create your account</h2>
                <p>It only takes a minute.</p>
            </div>

            <form id="registration-form">
                <div class="field-group">
                    <label for="name">Name</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        placeholder="Your full name"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input
                        id="phoneNumber"
                        name="phoneNumber"
                        type="tel"
                        autocomplete="tel"
                        placeholder="+1 555 123 4567"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Choose a password"
                        required
                    >
                </div>

                <button type="submit">Create account</button>
                <p id="registration-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
